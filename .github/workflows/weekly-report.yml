name: Weekly AI summary email

on:
  schedule:
    - cron: "43 4 * * 1"    # Mondays 04:43 UTC (07:43 in Beirut) - before the owner's Monday morning check
  workflow_dispatch:         # "Run workflow" button: send one now (handy for testing)

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull fresh numbers from GoHighLevel   # same pipeline as the dashboard, so the email matches it
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python fetch.py

      - run: python clean.py
      - run: python metrics.py                       # stops here if any consistency check fails

      - name: Write the summary with AI, check it, email it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python weekly_report.py
