name: Refresh dashboard

on:
  schedule:
    - cron: "45 2 * * *"   # every day at 02:45 UTC = 05:45 Beirut, ready before Monday morning
  workflow_dispatch:        # adds a "Run workflow" button for an on-demand refresh
  push:
    branches: [main]        # also run whenever new code is pushed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5              # 1. download your code

      - uses: actions/setup-python@v6          # 2. install Python
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt   # 3. install requests + python-dotenv

      - name: Fetch from GoHighLevel           # 4. the key comes from Secrets, never from the code
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python fetch.py

      - run: python clean.py                   # 5. clean
      - run: python metrics.py                 # 6. calculate + checks (stops here if any fail)

      - name: Safety check - no emails in the published data
        run: "! grep -q '@' site/data.json"

      - uses: actions/upload-pages-artifact@v4  # 7. package the site/ folder
        with:
          path: site

  deploy:
    needs: build                               # only runs if every step above succeeded
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4          # 8. publish to GitHub Pages
        