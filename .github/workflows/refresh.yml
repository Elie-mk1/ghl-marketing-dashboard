name: Test pipeline

# The live dashboard runs on Vercel (vercel.json). This workflow is the safety net for code changes:
# on every push it runs the full fetch -> clean -> metrics chain against GoHighLevel, so a change
# that breaks the cleaning or any consistency check shows up here as a red X.
on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button for a manual test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch from GoHighLevel             # the key comes from Secrets, never from the code
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python fetch.py

      - run: python clean.py
      - run: python metrics.py                   # fails the test if any consistency check fails

      - name: Safety check - no emails in the published data
        run: "! grep -q '@' site/data.json"
